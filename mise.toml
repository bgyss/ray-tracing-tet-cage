min_version = "2025.7.12"

[env]
MISE_DISABLE_VERSION_CHECK = "1"

[tasks.doctor]
description = "Report required tools and optional GPU/DCC integrations"
run = "nix develop path:. --command bash scripts/doctor.sh"

[tasks.configure]
description = "Configure the Nix-owned CMake build"
run = "nix develop path:. --command cmake --fresh --preset nix"

[tasks.build]
description = "Build all portable tools and host capability probes"
depends = ["configure"]
run = "nix develop path:. --command cmake --build --preset nix"

[tasks.test]
description = "Run the CTest suite in the Nix build"
depends = ["build"]
run = "nix develop path:. --command ctest --preset nix"

[tasks.format]
description = "Apply clang-format and nixfmt to project sources"
run = "nix develop path:. --command bash scripts/format.sh"

[tasks.format-check]
description = "Check C++, Objective-C++, Metal, and Nix formatting without changes"
run = "nix develop path:. --command bash scripts/format.sh --check"

[tasks.check]
description = "Run formatting, shell lint, configure, build, tests, and repository checks"
run = "nix develop path:. --command bash scripts/check.sh nix"

[tasks.nix-check]
description = "Build and test the pure portable Nix package and tooling contract"
run = "nix flake check path:. --print-build-logs"

[tasks.report]
description = "Regenerate deterministic JSON and Markdown result summaries"
run = "nix develop path:. --command python3 scripts/result_report.py results --json-out results/reproducibility-summary.json --markdown-out results/reproducibility-summary.md"

[tasks.renderman-probe]
description = "Inspect the installed RenderMan public headers and write a feasibility result"
run = "nix develop path:. --command bash -lc 'mkdir -p results && bash scripts/renderman_feasibility.sh > results/renderman-feasibility.json'"

[tasks.integration-probe]
description = "Record installed Unreal, standalone Cycles, and Blender integration prerequisites"
run = "nix develop path:. --command bash -lc 'mkdir -p results/integrations && bash scripts/integration_probe.sh > results/integrations/2026-08-08-host-gates.json'"

[tasks.cycles-verify]
description = "Verify pinned Cycles/Blender sources, LFS hydration, CPU tests, and Blender debug cache"
run = "nix develop path:. --command bash -lc 'mkdir -p results/integrations && CYCLES_VERIFY_OUTPUT=results/integrations/2026-08-08-cycles-verification.json python3 scripts/cycles_verify.py'"

[tasks.interop-probe]
description = "Record Vulkan/CUDA interop prerequisites without claiming a benchmark"
run = "nix develop path:. --command bash -lc 'mkdir -p results/capabilities && bash scripts/interop_probe.sh > results/capabilities/2026-07-28-cuda-vulkan-interop.json'"

[tasks.portable-scale]
description = "Run the synthetic CPU/stub scale matrix without promoting GPU claims"
run = "nix develop path:. --command bash -lc 'bash scripts/portable_scale_sweep.sh results/assets/two-tet-crossing.tetcage results/benchmarks/2026-07-28-portable-scale-sweep.json'"
