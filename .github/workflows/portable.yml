name: portable

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-portable:
    name: Nix portable checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Nix with flakes enabled
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run authoritative repository check
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
        run: nix develop path:. --command bash scripts/check.sh nix
